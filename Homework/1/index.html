
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Homework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>Even and Odd</h1>
        <input id="num" type="number" placeholder="Enter Number">
        <button id="butt">Click Here</button>
        <h2>Result</h2>
        <h3 id="result"></h3>
    </div>

    <div>
        <h1>Largest of three numbers</h1>
        <input id="num1" type="number" placeholder="Enter Number">
        <input id="num2" type="number" placeholder="Enter Number">
        <input id="num3" type="number" placeholder="Enter Number">
        <h2>Result</h2>
        <button id="butt1">Click Here</button>
        <h3 id="result1"></h3>
    </div>

    <div>
        <h1>Multiplication Table</h1>
        <input id="num4" type="number" placeholder="Enter Number">
        <h2>Result</h2>
        <button id="butt2">Click Here</button>
        <h3 id="result2"></h3>
    </div>

    <div>
        <h1>Factorial</h1>
        <input id="num5" type="number" placeholder="Enter Number">
        <h2>Result</h2>
        <button id="butt3">Click Here</button>
        <h3 id="result3"></h3>
    </div>

    <div>
        <h1>Student Names (forEach)</h1>
        <h2>Result</h2>
        <button id="butt4">Show Names</button>
        <h3 id="result4"></h3>
    </div>

    <div>
        <h1>Marks Above 70 (filter)</h1>
        <h2>Result</h2>
        <button id="butt5">Show Marks</button>
        <h3 id="result5"></h3>
    </div>

    <div>
        <h1>Student Object</h1>
        <h2>Result</h2>
        <button id="butt6">Show Student</button>
        <h3 id="result6"></h3>
    </div>

    <div>
        <h1>Change Heading Style</h1>
        <h3 id="heading1">I will change!</h3>
        <button id="butt7">Change Me</button>
    </div>

    <div>
        <h1>Counter</h1>
        <h3 id="counter">0</h3>
        <button id="butt8">+</button>
        <button id="butt9">-</button>
    </div>

    <div>
        <h1>Form Validation</h1>
        <form id="form1">
            <input id="formName" type="text" placeholder="Name">
            <input id="formEmail" type="email" placeholder="Email">
            <input id="formMarks" type="number" placeholder="Marks">
            <button type="submit">Submit</button>
        </form>
        <h3 id="result7"></h3>
    </div>

    <div>
        <h1>To-Do List</h1>
        <input id="num6" type="text" placeholder="Enter Task">
        <button id="butt10">Add</button>
        <ul id="list1"></ul>
    </div>

    <div>
        <h1>Fetch Users from API</h1>
        <button id="butt11">Load Users</button>
        <ul id="list2"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
