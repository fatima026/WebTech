<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Homework No. 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>1st Web Homework</h1>
        <p>JS and Logic Desing Tasks</p>
    </header>

    <div class="task">
        <h2>Even and Odd</h2>
        <input id="num" type="number" placeholder="Enter Number">
        <button id="butt">Check</button>
        <h3 class="result" id="result"></h3>
    </div>

    <div class="task">
        <h2>Largest of Three Numbers</h2>
        <input id="num1" type="number" placeholder="Number 1">
        <input id="num2" type="number" placeholder="Number 2">
        <input id="num3" type="number" placeholder="Number 3">
        <button id="butt1">Find Largest</button>
        <h3 class="result" id="result1"></h3>
    </div>

    <div class="task">
        <h2>Multiplication Table</h2>
        <input id="num4" type="number" placeholder="Enter Number">
        <button id="butt2">Generate</button>
        <h3 class="result" id="result2"></h3>
    </div>

    <div class="task">
        <h2>Factorial</h2>
        <input id="num5" type="number" placeholder="Enter Number">
        <button id="butt3">Calculate</button>
        <h3 class="result" id="result3"></h3>
    </div>

    <div class="task">
        <h2>Student Names (forEach)</h2>
        <button id="butt4">Show Names</button>
        <h3 class="result" id="result4"></h3>
    </div>

    <div class="task">
        <h2>Marks Above 70 (filter)</h2>
        <button id="butt5">Show Marks</button>
        <h3 class="result" id="result5"></h3>
    </div>

    <div class="task">
        <h2>Student Object</h2>
        <button id="butt6">Show Student</button>
        <h3 class="result" id="result6"></h3>
    </div>

    <div class="task">
        <h2>Change Heading Style</h2>
        <h3 id="heading1">I will change!</h3>
        <button id="butt7">Change Me</button>
    </div>

    <div class="task">
        <h2>Counter</h2>
        <h3 id="counterDisplay">0</h3>
        <button id="butt9">−</button>
        <button id="butt8">+</button>
    </div>

    <div class="task">
        <h2>Form Validation</h2>
        <form id="form1">
            <input id="formName" type="text" placeholder="Name">
            <input id="formEmail" type="email" placeholder="Email">
            <input id="formMarks" type="number" placeholder="Marks">
            <button type="submit">Submit</button>
        </form>
        <h3 class="result" id="result7"></h3>
    </div>

    <div class="task">
        <h2>To-Do List</h2>
        <input id="num6" type="text" placeholder="Enter Task">
        <button id="butt10">Add</button>
        <ul id="list1"></ul>
    </div>

    <div class="task">
        <h2>Fetch Users from API</h2>
        <button id="butt11">Load Users</button>
        <ul id="list2"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
